# meowhub task runner (ADR 0034: the Taskfile is the interface — a person and
# CI invoke the same verbs; nothing is documented as a raw command). Every
# verb runs in containers — no native database or runtime install required
# beyond Docker and Task itself.
version: '3'

dotenv: ['.env']

vars:
  COMPOSE: docker compose -f compose.yaml

tasks:
  up:
    desc: Start the system locally (no domain, no tunnel — spec 0001 R14a)
    cmds:
      - '{{.COMPOSE}} --profile local up -d --wait postgres'
      - task: migrate
      - '{{.COMPOSE}} --profile local up -d --wait model-gateway-stub'
      - '{{.COMPOSE}} --profile local up -d --wait authentik-server'
      - '{{.COMPOSE}} --profile local up -d --wait authentik-worker'
      - bash scripts/configure-token-bridge.sh
      - '{{.COMPOSE}} --profile local up -d --wait token-bridge'
      - '{{.COMPOSE}} --profile local up -d --wait postgrest'
      - '{{.COMPOSE}} --profile local up -d --wait n8n'
      - bash scripts/import-workflows.sh
      - '{{.COMPOSE}} restart n8n'
      - '{{.COMPOSE}} --profile local up -d --wait n8n'
      - '{{.COMPOSE}} --profile local up -d --wait proxy'
      - '{{.COMPOSE}} --profile local up -d --wait uptime-kuma'
      - bash scripts/configure-monitoring.sh
      - '{{.COMPOSE}} --profile local up -d --wait scheduler'

  down:
    desc: Stop the system and remove containers
    cmds:
      - '{{.COMPOSE}} --profile local down'

  migrate:
    desc: Apply pending migrations (dbmate, containerised — ADR 0018)
    cmds:
      - '{{.COMPOSE}} run --rm migrate --migrations-dir /db/migrations --schema-file /out/schema.sql up'
      - '{{.COMPOSE}} up -d --wait postgres'
      - bash scripts/set-authenticator-password.sh

  migrate:new:
    desc: 'Create a new migration: task migrate:new -- name_of_migration'
    cmds:
      - '{{.COMPOSE}} run --rm -v "$(pwd)/db/migrations:/db/migrations" --entrypoint dbmate migrate --migrations-dir /db/migrations new {{.CLI_ARGS}}'

  seed:
    desc: Load the synthetic household (ADR 0015)
    cmds:
      - '{{.COMPOSE}} exec -T postgres psql -U "$POSTGRES_SUPERUSER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -f /dev/stdin < db/seed/household.sql'

  test:
    desc: One command, clean checkout to green suite (spec 0001 R15)
    cmds:
      - task: test:db
      - task: test:files
      - task: test:i18n
      - task: test:workflows
      - task: test:ingress
      - task: test:monitoring
      - task: test:backup
      - task: test:restore
      - task: test:drift-schedule
      - task: test:scaffold-admin
      - task: test:member-lifecycle

  test:db:
    desc: pgTAP against a throwaway database — created, migrated, seeded, torn down
    cmds:
      - bash scripts/test-db.sh

  test:files:
    desc: Content-addressed file storage — dedup and integrity (ADR 0019, spec 0001 A7/A7a)
    cmds:
      - '{{.COMPOSE}} up -d --wait postgres'
      - bash scripts/test-file-storage.sh

  test:i18n:
    desc: The message catalogue — missing keys fail loudly, both languages stay in step (ADR 0017)
    cmds:
      - bash scripts/test-i18n.sh

  test:workflows:
    desc: n8n end-to-end tests with the model gateway stubbed (run on demand — ADR 0015)
    cmds:
      - bash scripts/test-health-check.sh
      - bash scripts/test-telegram-dedup.sh
      - bash scripts/test-model-gateway.sh
      - bash scripts/test-authentik-blueprints.sh
      - bash scripts/test-authentik-lockout.sh
      - bash scripts/test-token-bridge.sh
      - bash scripts/test-postgrest.sh
      - bash scripts/test-proxy-path.sh
      - bash scripts/test-admin-surfaces.sh
      - bash scripts/test-telegram-linking.sh

  test:ingress:
    desc: The boundary — no container port reachable except through the proxy, TLS terminates there (spec 0001 T11, A6)
    cmds:
      - bash scripts/test-ingress-boundary.sh
      - bash scripts/test-rate-limit.sh

  test:monitoring:
    desc: Uptime Kuma's dead man's switch — silence past the window becomes an alert (spec 0001 T13, ADR 0020)
    cmds:
      - bash scripts/test-heartbeat-alert.sh

  test:backup:
    desc: A snapshot exists, is ciphertext, and the offsite variable is the only difference (spec 0001 T14, ADR 0009)
    cmds:
      - bash scripts/test-backup.sh

  test:restore:
    desc: A good restore reports success; a sabotaged one fails and is never counted as good (spec 0001 T15, R11)
    cmds:
      - bash scripts/test-restore-verification.sh

  test:drift-schedule:
    desc: Drift detection actually runs on a schedule, from the scheduler container (spec 0001 T16, R13)
    cmds:
      - bash scripts/test-drift-schedule.sh

  test:scaffold-admin:
    desc: The first admin, once — a second run refused, a missing variable named (spec 0002 T13, R14a/b)
    cmds:
      - bash scripts/test-scaffold-admin.sh

  test:member-lifecycle:
    desc: A temporary password reaches nothing until changed; deactivation ends access immediately (spec 0002 T13, A1b/A17)
    cmds:
      - bash scripts/test-forced-password-change.sh
      - bash scripts/test-deactivation.sh

  export:
    desc: Export n8n workflows to this repository (ADR 0010)
    cmds:
      - bash scripts/export-workflows.sh

  drift:
    desc: Compare the running configuration against what is committed (ADR 0010)
    cmds:
      - bash scripts/detect-drift.sh

  backup:
    desc: Take a restic snapshot, local and offsite (ADR 0009)
    cmds:
      - bash scripts/backup.sh

  restore:
    desc: Restore the latest snapshot into a scratch environment
    cmds:
      - bash scripts/restore.sh

  verify-restore:
    desc: Monthly restore verification, with a heartbeat on success (ADR 0009, 0020)
    cmds:
      - bash scripts/verify-restore.sh

  scaffold-admin:
    desc: Create the first admin from the environment; refuses if any account exists
    cmds:
      - bash scripts/scaffold-admin.sh
