version: 1
metadata:
  name: meowhub forced password change for admin-created accounts
entries:
  # R1d: the password an admin sets is temporary — the account must reach
  # nothing until the member changes it. Authentik has no built-in "must
  # change" flag, so this reuses the same two stages its own self-service
  # default-password-change flow already has (a Prompt asking for the new
  # password, then a User Write stage that sets it) by binding them into
  # default-authentication-flow as well, gated by a policy — the same
  # "compose native primitives, gated by a policy" pattern spec 0002 T6
  # already used for lockout, since Authentik's own forced-change feature
  # is Enterprise-only (R17/A33).
  #
  # The gate compares the account's password_change_date (a real column,
  # updated by Authentik's own set_password() on every change, admin-made
  # or self-made alike) against password_set_by_admin_at, an attribute
  # scripts/create-member.sh records right after setting the temporary
  # password. Equal (within a second, to absorb serialization rounding
  # between the two independently-formatted timestamps) means nothing has
  # changed the password since the admin set it — gate stays shut. Once
  # the member changes it, password_change_date moves and the gate opens
  # on its own: no separate "clear this flag" step to get wrong.
  - model: authentik_policies_expression.expressionpolicy
    state: present
    identifiers:
      name: meowhub-password-change-required
    attrs:
      expression: |
        attrs = request.user.attributes or {}
        set_at = attrs.get("password_set_by_admin_at")
        if not set_at:
            return False
        from datetime import datetime
        try:
            stored = datetime.fromisoformat(set_at)
        except ValueError:
            return False
        current = request.user.password_change_date
        return current is not None and abs((current - stored).total_seconds()) < 1
    id: password-change-required-policy

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_prompt.promptstage, [name, default-password-change-prompt]]
      order: 26
    attrs:
      policy_engine_mode: all
      re_evaluate_policies: true
    id: forced-change-prompt-binding

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf forced-change-prompt-binding
      policy: !KeyOf password-change-required-policy
      order: 0
    attrs:
      negate: false
      enabled: true

  - model: authentik_flows.flowstagebinding
    state: present
    identifiers:
      target: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      stage: !Find [authentik_stages_user_write.userwritestage, [name, default-password-change-write]]
      order: 27
    attrs:
      policy_engine_mode: all
      re_evaluate_policies: true
    id: forced-change-write-binding

  - model: authentik_policies.policybinding
    state: present
    identifiers:
      target: !KeyOf forced-change-write-binding
      policy: !KeyOf password-change-required-policy
      order: 0
    attrs:
      negate: false
      enabled: true
