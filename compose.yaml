# meowhub — one Compose file, unchanged between the rented host and the home
# server (ADR 0002); only .env and DNS differ. Services join this file as
# their phase in docs/implementation-plan.md arrives — today, PostgreSQL only.

services:
  postgres:
    build: ./db/docker      # PostgreSQL + pgTAP, one image everywhere (see db/docker/Dockerfile)
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/docker/init:/docker-entrypoint-initdb.d:ro
    # No published port (spec 0001 T11 / R6): reachable only from other
    # containers on this Compose network, never directly from the host.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ['local', 'deployed']

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./db/migrations:/db/migrations:ro
      - ./db:/out
    command: ['--migrations-dir', '/db/migrations', '--schema-file', '/out/schema.sql', 'up']
    profiles: ['local', 'deployed']

  n8n:
    build: ./n8n/docker    # n8n + the prompt/tool mount check (see n8n/docker/Dockerfile)
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      # A fixed platform constant, not a deployment setting (ADR 0034): n8n's
      # own database is never the household's (ADR 0004), created by
      # db/docker/init/10-create-n8n-database.sh on first boot.
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_SUPERUSER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Workflows read configuration (the delivery mode, the bot token) from
      # the environment by design (ADR 0034) — this instance is single-tenant
      # and behind our own auth boundary, so allowing $env in Code nodes here
      # is a deployment choice, not exposure to untrusted workflow authors.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
      TELEGRAM_LOCAL_BOT_TOKEN: ${TELEGRAM_LOCAL_BOT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DELIVERY_MODE: ${TELEGRAM_DELIVERY_MODE}
      # Points at the local stub by default so nothing here costs money or
      # needs a real key until a developer deliberately changes it (spec
      # 0001 T18, ADR 0015).
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # The bot resolves an incoming sender through PostgREST as hh_agent
      # (spec 0002 T12, R6c) — the same data path the app itself would use
      # (ADR 0014), not a direct database credential of its own (R16). The
      # workflow mints its own short-lived token per request from this
      # secret (crypto, allowed below), the same HS256 shape the token
      # bridge mints for a browser session.
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts:/prompts:ro
      - ./tools:/tools:ro
      - ./workflows:/workflows:ro
    # No published port (spec 0001 T11 / R6): reachable only through the
    # proxy below, never directly from the host.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:5678/healthz || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['local', 'deployed']

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.2
    command: server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_SUPERUSER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Authentik's own console admin (R17a: self-referential, break-glass
      # covers the case this is misconfigured) — never the household's
      # first admin, which spec 0002 T13 creates as a real member instead.
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      # Read by authentik/blueprints/02-app-boundary.yaml (spec 0002 T9):
      # the proxy's own address, since the household app has none yet.
      AUTHENTIK_APP_EXTERNAL_HOST: ${AUTHENTIK_APP_EXTERNAL_HOST}
    volumes:
      - authentik_media:/media
      - ./authentik/blueprints:/blueprints/local:ro
    # No published port (spec 0001 T11 / R6): reachable only through the
    # proxy, once T9/T10 wire the forward-auth path.
    healthcheck:
      test: ['CMD', '/lifecycle/ak', 'healthcheck']
      interval: 5s
      timeout: 3s
      retries: 30
    profiles: ['local', 'deployed']

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    command: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_SUPERUSER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Read by authentik/blueprints/02-app-boundary.yaml (spec 0002 T9):
      # the proxy's own address, since the household app has none yet.
      AUTHENTIK_APP_EXTERNAL_HOST: ${AUTHENTIK_APP_EXTERNAL_HOST}
    volumes:
      - authentik_media:/media
      - ./authentik/blueprints:/blueprints/local:ro
    profiles: ['local', 'deployed']

  token-bridge:
    build: ./token-bridge/docker   # see token-bridge/docker/server.py — ADR 0041, spec 0002 T7
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # AUTHENTIK_API_TOKEN comes through env_file, read fresh from disk at
    # container creation, rather than as a ${...}-substituted `environment`
    # entry: Task's own dotenv loads .env once at the start of `task up`,
    # so a value scripts/configure-token-bridge.sh writes to .env mid-run
    # would otherwise be shadowed by the empty value Task already exported
    # into every command's environment before that script ever ran — the
    # same reason the scheduler service below reads the whole file this way.
    env_file: .env
    environment:
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      AUTHENTIK_API_BASE_URL: http://authentik-server:9000
    # No published port: reached only by the proxy's forward_auth chain
    # (spec 0001 T11 / R16b), once T9 wires it in.
    profiles: ['local', 'deployed']

  postgrest:
    image: postgrest/postgrest:v12.2.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # authenticator is the one role that ever connects (spec 0002 R15b);
      # PostgREST switches into whatever role a verified JWT names via SET
      # ROLE for the duration of each request.
      PGRST_DB_URI: postgres://authenticator:${DB_ROLE_AUTHENTICATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      # Sets meowhub.actor from the verified JWT's own member_id claim
      # before every request (spec 0002 T12) — audit_log_trigger requires
      # it, and nothing else can set a session-local GUC on PostgREST's
      # behalf per request.
      PGRST_DB_PRE_REQUEST: pgrst_pre_request
    # No published port (spec 0001 T11 / R6, spec 0002 R16b): reachable
    # only through the proxy, once T9 wires the forward-auth chain in.
    profiles: ['local', 'deployed']

  proxy:
    build: ./proxy/docker   # Caddy + the rate-limit plugin (see proxy/docker/Dockerfile)
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - '${PROXY_HTTP_PORT}:80'
      - '${PROXY_HTTPS_PORT}:443'
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '-q', '-O-', 'https://localhost/healthz']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['local', 'deployed']

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    # Loopback stays published, deliberately, alongside the SSO-gated
    # proxy route T10 adds: scripts/heartbeat-curl.sh and the backup/
    # restore/drift jobs push heartbeats over it from the host, and a push
    # token was never login-gated in the first place — disableAuth (set
    # below) only removes the login prompt for the dashboard itself.
    # Reaching that dashboard via loopback still requires the same SSH
    # access this system already treats as admin-level trust (ADR 0024's
    # break-glass path is exactly "SSH access, no Authentik required").
    ports:
      - '127.0.0.1:${UPTIME_KUMA_PORT}:3001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:3001/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['local', 'deployed']

  model-gateway-stub:
    build: ./model-gateway/docker   # see model-gateway/docker/server.py — spec 0001 T18, ADR 0015
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MODEL_GATEWAY_STUB_PORT}:8090'
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8090/')"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ['local', 'deployed']

  scheduler:
    build: ./scheduler/docker   # cron + docker CLI, the one container allowed to run jobs (see scheduler/docker/Dockerfile)
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    env_file: .env
    environment:
      # The compose project name is normally inferred from the directory
      # basename holding compose.yaml — "workspace" in here, since the repo
      # is bind-mounted at /workspace, not whatever the host's checkout is
      # actually named. Passed through explicitly so `docker compose exec`
      # inside this container finds the same running services the host's
      # own invocations do, whatever this checkout is called.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - .:/workspace:ro
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: ['local', 'deployed']

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
  kuma_data:
  authentik_media:
